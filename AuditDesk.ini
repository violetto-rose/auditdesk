; Audit Desk portable configuration
; Set Console to "hide" to run without the PowerShell window, or "show" for troubleshooting.
[Window]
Console=hide

[Audit]
; Large files threshold used by the user-folder scan.
LargeFileThresholdMB=500
; Number of Local AppData folders kept in the report.
LocalFolderLimit=50

[Performance]
; How frequently the UI receives completed audit checks.
ProgressPollMilliseconds=250

[Export]
; Open the folder after saving an AI JSON export.
OpenFolderAfterExport=false
